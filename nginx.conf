server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Ensure all required MIME types are registered
    types {
        include /etc/nginx/mime.types;
        application/manifest+json webmanifest;
        image/avif avif;
        font/woff2 woff2;
    }

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/manifest+json;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routing: try exact file, directory index, or clean URL with .html extension
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets (images, web fonts, stylesheets, scripts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML files: revalidate to ensure updates are visible immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Metadata files
    location ~* \.(?:webmanifest|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Fallback error page
    error_page 404 /index.html;
}
